# Write a short, attention-grabbing description of your project.
desc: >
  Our project is an expansion on chess. Instead of only having the 
  classic 16 pieces, we have added a new piece: the camel. The camel 
  is immortal and cannot be captured by either side, and at the end 
  of each turn the camel must be moved to a new square on the chessboard. 
  Players can use the camel to obstruct their opponents and create new 
  tactics that have never been seen before!